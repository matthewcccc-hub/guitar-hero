<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guitar Hero — Riff Roller · Rounded Dice</title>
<style>
  :root{
    --bg:#07050a;
    --panel:#100a17;
    --panel2:#171020;
    --panel3:#0b080f;
    --ink:#f4e9cf;
    --muted:#a89daf;
    --line:#4b3558;
    --gold:#f7c417;
    --yellow:#fbe038;
    --orange:#f46b04;
    --violet:#7a3db8;
    --red:#d6252c;
    --green:#ffd21f;
    --blue:#3f7fcf;
    --purple:#8f54c7;
    --shadow:#020204;
    --header-h:58px;
    --footer-h:76px;
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color-scheme:dark}
  body{
    color:var(--ink);
    background:
      radial-gradient(circle at 50% -20%,rgba(122,61,184,.22),transparent 42rem),
      linear-gradient(180deg,#0d0814 0%,#07050a 52%,#040305 100%);
    font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  }
  button,input{font:inherit}
  button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .app{height:100svh;max-height:100%;display:grid;grid-template-rows:var(--header-h) minmax(0,1fr);overflow:hidden}

  .topbar{
    min-height:var(--header-h);display:flex;align-items:center;gap:10px;padding:7px 10px 7px 14px;
    border-bottom:2px solid #3e2a49;background:rgba(10,7,14,.96);box-shadow:0 3px 0 #020204;z-index:5;
  }
  .brand{min-width:0;display:flex;align-items:baseline;gap:9px;white-space:nowrap}
  .brand h1{font-size:clamp(17px,2.5vw,25px);line-height:1;margin:0;color:#fff1ae;text-shadow:2px 2px 0 #3e1605;letter-spacing:.03em}
  .brand small{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#b89ac8}
  .toolbar{margin-left:auto;display:flex;gap:6px;min-width:0}
  .tool-btn,.btn,.tiny-btn,.pager-btn,.step-btn{
    border:1px solid #604b6c;background:#18101f;color:#f2e6ce;cursor:pointer;font-weight:900;text-transform:uppercase;
    box-shadow:2px 2px 0 #020204;
  }
  .tool-btn{height:40px;min-width:44px;padding:5px 9px;font-size:10px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  .tool-btn:hover,.btn:hover,.tiny-btn:hover,.pager-btn:hover,.step-btn:hover{background:#25162f;border-color:#9a77ad}
  .tool-btn .count-badge{min-width:19px;height:19px;padding:0 5px;border-radius:10px;display:grid;place-items:center;background:#4f2c67;color:#fff;font-size:9px}
  .tool-icon{font-size:15px;line-height:1}
  .tool-label{display:inline}

  .screen-stack{position:relative;min-height:0;overflow:hidden}
  .screen{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) var(--footer-h);opacity:0;pointer-events:none;transform:translateX(2%);transition:opacity .16s ease,transform .16s ease}
  .screen.active{opacity:1;pointer-events:auto;transform:none}
  .screen-body{min-height:0;padding:10px;overflow:hidden;display:flex;flex-direction:column;gap:8px}
  .screen-footer{height:var(--footer-h);border-top:2px solid #3f2b4a;background:rgba(10,7,14,.97);padding:8px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
  .footer-status{min-width:0;color:#b9adbf;font-size:11px;line-height:1.35}
  .footer-status b{color:#f3e2ad}
  .footer-actions{display:flex;gap:7px;align-items:center}
  .btn{min-height:48px;padding:9px 15px;font-size:11px;letter-spacing:.04em}
  .btn.primary{background:#6a2f92;border:2px solid #b58add;color:#fff}
  .btn.gold{background:#5c4605;border:2px solid var(--gold);color:#fff4c4}
  .btn.hot{background:#7e1c15;border:2px solid #e55a26;color:#fff1d8}
  .btn:disabled,.tool-btn:disabled,.tiny-btn:disabled,.pager-btn:disabled,.step-btn:disabled{opacity:.38;cursor:not-allowed;filter:grayscale(.5)}

  .play-head{height:34px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex:0 0 auto}
  .play-title{font-size:11px;letter-spacing:.12em;color:var(--gold);font-weight:1000;text-transform:uppercase}
  .play-note{font-size:9px;color:#9f93a6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pool-pager{display:flex;align-items:center;gap:5px;flex:0 0 auto}
  .pager-btn{height:30px;min-width:32px;padding:3px 8px;font-size:11px}
  .pager-label{font-size:9px;color:#b6a9bc;min-width:62px;text-align:center}

  .pool-grid{min-height:0;flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px}
  .pool-card{min-width:0;min-height:0;background:linear-gradient(180deg,rgba(23,16,32,.96),rgba(11,8,15,.97));border:2px solid #493454;box-shadow:3px 3px 0 #020204;padding:8px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px;position:relative}
  .pool-card::after{content:"";position:absolute;inset:3px;border:1px solid rgba(247,196,23,.08);pointer-events:none}
  .pool-card.has-selection{border-color:#76548a}
  .pool-card.empty-slot{opacity:.25;border-style:dashed;box-shadow:none}
  .pool-card.empty-slot::after{display:none}
  .pool-header{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .pool-name{font-size:clamp(11px,1.8vw,15px);font-weight:1000;color:#f1e2b4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pool-stat{font-size:8px;color:#9f92a6;white-space:nowrap}
  .tone-grid{min-height:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;align-items:flex-start;gap:7px;padding:3px}
  .tone-pick{width:64px;height:64px;flex:0 0 64px;border:1px solid #3d3045;background:#0a070d;cursor:pointer;display:grid;place-items:center;padding:4px;position:relative;color:#e9dac0}
  .tone-pick:hover{border-color:#765b83;background:#100a17}
  .tone-pick.selected{border:2px solid var(--gold);background:#171005;box-shadow:0 0 0 2px #4b3505 inset}
  .tone-pick.selected::before{content:"ROLL";position:absolute;top:3px;right:3px;background:var(--gold);color:#160f01;font-size:7px;padding:2px 3px;font-weight:1000;z-index:2}
      .die-art{display:block;width:min(54px,100%);aspect-ratio:1/1;transition:transform .12s ease,filter .12s ease}
  .die-art svg{display:block;width:100%;height:100%;overflow:visible;image-rendering:pixelated}
  .tone-pick.selected .die-art{transform:translateY(-2px);filter:drop-shadow(0 0 6px rgba(247,196,23,.55))}
  .flat-die-art{display:grid;place-items:center;width:48px;aspect-ratio:1/1;border:3px solid #08060b;border-radius:4px;background:var(--flat-tone);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),inset -5px -5px 0 rgba(0,0,0,.14),2px 2px 0 #020204;color:#100b13;font-size:27px;line-height:1;font-weight:1000;text-shadow:0 1px 0 rgba(255,255,255,.20)}
  .flat-die-art.neutral::after{content:"";width:9px;height:9px;border:2px solid rgba(12,8,15,.28);border-radius:50%}
  .commit-card .flat-die-art{width:48px}

  .results-body{padding:7px;gap:6px}
  .results-head{display:flex;align-items:center;justify-content:center;gap:10px;height:28px;flex:0 0 auto}
  .riff-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#f7c417;font-weight:1000}
  .dice-tray-shell{min-height:0;flex:1;width:min(1040px,100%);align-self:center;position:relative;padding:10px;background:#171015;border:2px solid #6f4b31;box-shadow:inset 0 0 0 3px #251812,inset 0 0 0 6px #0b0708,3px 3px 0 #020204}
  .dice-tray-shell::before,.dice-tray-shell::after{content:"";position:absolute;pointer-events:none;z-index:2}
  .dice-tray-shell::before{inset:5px;border:2px solid #8d6e4b;box-shadow:inset 0 0 0 2px #2b1b14}
  .dice-tray-shell::after{display:none}
  .dice-tray{position:absolute;inset:12px;z-index:1;overflow:hidden;background:radial-gradient(circle at 50% 40%,#27172b 0%,#180f1c 48%,#0c080f 100%);border:2px solid #07050a;box-shadow:inset 0 0 22px #020204;perspective:760px;transform-style:preserve-3d}
  .dice-tray::before{content:"DICE TRAY";position:absolute;left:8px;top:7px;font-size:8px;letter-spacing:.15em;color:#624a67;z-index:0}
  #meshCanvas,#diceCanvas,#diceOverlay{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
  #meshCanvas,#diceCanvas{z-index:3;cursor:pointer}
  #meshCanvas{display:none}
  #diceOverlay{z-index:4;pointer-events:none}
  #diceCanvas:focus-visible{outline:3px solid var(--yellow);outline-offset:-5px}
  .tray-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(22px,5vw,58px);font-weight:1000;letter-spacing:.18em;color:rgba(192,160,255,.035);pointer-events:none;z-index:1;white-space:nowrap}
  .dice-tray.rolling #diceCanvas,.dice-tray.rolling #meshCanvas{cursor:default}
  .tray-die{--die-size:88px;--die-depth:44px;--symbol-size:42px;position:absolute;left:50%;top:50%;width:var(--die-size);height:calc(var(--die-size) + 30px);padding:0;border:0;background:transparent;color:var(--ink);cursor:pointer;transform:translate(-50%,-50%);z-index:3;touch-action:manipulation}
  .tray-die:focus-visible{outline:3px solid var(--yellow);outline-offset:7px}
  .cube-stage{width:var(--die-size);height:var(--die-size);perspective:560px;transform-style:preserve-3d;will-change:transform}
  .die-cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform;transform:rotateX(-18deg) rotateY(28deg) rotateZ(0deg)}
  .die-face{position:absolute;inset:0;display:grid;place-items:center;background:var(--tone-base);border:3px solid #07050a;box-shadow:inset 0 0 0 3px rgba(255,255,255,.12),inset -8px -8px 0 rgba(0,0,0,.16);backface-visibility:hidden;font-size:var(--symbol-size);line-height:1;font-weight:1000;color:#130d16;text-shadow:1px 1px 0 rgba(255,255,255,.33);image-rendering:pixelated}
  .die-face::after{content:"";position:absolute;inset:5px;border:2px solid rgba(255,255,255,.10);pointer-events:none}
  .face-front{transform:translateZ(var(--die-depth));background:var(--tone-base)}
  .face-back{transform:rotateY(180deg) translateZ(var(--die-depth));background:var(--tone-dark)}
  .face-right{transform:rotateY(90deg) translateZ(var(--die-depth));background:var(--tone-dark)}
  .face-left{transform:rotateY(-90deg) translateZ(var(--die-depth));background:var(--tone-base)}
  .face-top{transform:rotateX(90deg) translateZ(var(--die-depth));background:var(--tone-light)}
  .face-bottom{transform:rotateX(-90deg) translateZ(var(--die-depth));background:var(--tone-dark)}
  .tray-die.selected .die-face{border-color:var(--gold);box-shadow:inset 0 0 0 3px rgba(255,238,120,.28),inset -8px -8px 0 rgba(0,0,0,.16)}
  .die-tag{position:absolute;left:50%;top:calc(var(--die-size) + 7px);transform:translateX(-50%);width:max-content;max-width:145px;padding:3px 6px;background:rgba(6,4,8,.88);border:1px solid #4b3653;color:#c9bdca;font-size:8px;line-height:1.15;white-space:nowrap;box-shadow:2px 2px 0 #020204}
  .die-tag b{color:#f2dfae}
  .tray-die.selected .die-tag{border-color:var(--gold);color:#fff1b0}
  .dice-tray.rolling .tray-die{pointer-events:none}
  .dice-tray.rolling .die-tag{opacity:.25}
  .tray-rumble{animation:trayRumble .24s steps(3,end) 3}
  @keyframes trayRumble{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}100%{transform:translate(0,0)}}

  .overlay{position:absolute;inset:0;background:rgba(2,2,4,.74);z-index:20;opacity:0;pointer-events:none;transition:opacity .16s ease}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{position:absolute;top:0;right:0;height:100%;width:min(520px,100%);background:linear-gradient(180deg,#120b19,#09070d);border-left:2px solid #5b4167;box-shadow:-6px 0 0 rgba(0,0,0,.45);transform:translateX(103%);transition:transform .18s ease;display:grid;grid-template-rows:54px minmax(0,1fr) 66px}
  .overlay.open .drawer{transform:none}
  .drawer-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:2px solid #3e2c48;background:#0c0811}
  .drawer-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:1000}
  .drawer-sub{font-size:9px;color:#9f93a6;margin-left:auto;white-space:nowrap}
  .close-btn{width:38px;height:38px;margin-left:4px;border:1px solid #604b6c;background:#17101e;color:#eadfc9;cursor:pointer;font-weight:1000;font-size:16px}
  .drawer-body{min-height:0;overflow:hidden;padding:10px;display:flex;flex-direction:column;gap:8px}
  .drawer-foot{border-top:2px solid #392741;background:#0b0810;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .drawer-foot .btn{min-height:46px}

  .setup-pool-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;flex:0 0 auto}
  .pool-tab{height:38px;min-width:0;border:1px solid #4a3854;background:#100b16;color:#cbbfd0;font-size:9px;font-weight:900;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px}
  .pool-tab.active{border:2px solid var(--gold);background:#251c08;color:#fff0a1}
  .setup-card{flex:1;min-height:0;border:2px solid #463150;background:#0d0912;padding:10px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px}
  .name-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
  label{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#b7abbc;display:grid;gap:5px;min-width:0}
  input[type="text"]{width:100%;height:40px;background:#08060b;border:1px solid #4d3b56;color:#f7ead1;padding:7px 9px;font-size:16px}
  .tone-steppers{min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:7px}
  .tone-step{border:1px solid #3e3046;background:#09070d;padding:6px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:7px;align-items:center}
  .tone-step .die-art{width:48px}
  .stepper{display:grid;grid-template-columns:34px minmax(34px,1fr) 34px;gap:4px;align-items:center}
  .step-btn{height:34px;padding:0;font-size:17px}
  .step-value{height:34px;display:grid;place-items:center;background:#130d18;border:1px solid #4b394f;color:#fff1bf;font-size:16px;font-weight:1000}
  .step-label{font-size:9px;color:#a89bae;margin-bottom:5px;text-align:center}
  .setup-inventory{font-size:9px;color:#ab9eb2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .model-card{flex:1;min-height:0;border:2px solid #463150;background:#0d0912;padding:10px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:9px}
  .model-status{border:1px solid #4a3854;background:#09070d;padding:9px;font-size:10px;line-height:1.45;color:#bdb0c3}
  .model-status b{color:#f1dda8}
  .model-actions{display:flex;flex-wrap:wrap;gap:7px}
  .file-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 12px;border:2px solid #8d6e4b;background:#25170e;color:#fff0c2;font-size:10px;font-weight:1000;text-transform:uppercase;cursor:pointer}
  .file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .mapping-grid{min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:6px}
  .mapping-cell{border:1px solid #3e3046;background:#09070d;padding:6px;display:grid;gap:5px;align-content:center}
  .mapping-cell b{font-size:9px;color:#e5d5a8}
  .mapping-cell select{width:100%;height:36px;background:#130d18;border:1px solid #4b394f;color:#f4e9cf;padding:4px;font:inherit;font-size:10px}
  .committed-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:7px}
  .commit-card{min-width:0;min-height:0;border:1px solid #46364f;background:#0c0810;padding:6px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:6px;align-items:center}
  .commit-card .die-art{width:52px}
  .commit-copy{min-width:0}
  .commit-copy b{display:block;font-size:10px;color:#efdfb3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .commit-copy span{display:block;font-size:8px;color:#9e92a5;margin-top:4px;white-space:nowrap}
  .tiny-btn{height:34px;padding:4px 6px;font-size:8px}
  .empty-state{flex:1;display:grid;place-items:center;text-align:center;color:#7f7486;border:2px dashed #382b40;background:#09070c;padding:18px;font-size:11px}
  .drawer-pager{display:flex;align-items:center;gap:6px;margin-left:auto}

  .log-list{flex:1;min-height:0;display:grid;grid-template-rows:repeat(6,minmax(0,1fr));gap:5px}
  .log-row{min-height:0;border:1px solid #33273a;background:#0b080f;padding:6px 8px;font-size:9px;line-height:1.25;color:#b8acbe;display:flex;align-items:center;overflow:hidden}
  .log-row b{color:#eedba7}
  .log-row span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  @media (max-width:700px){
    :root{--header-h:54px;--footer-h:72px}
    .topbar{padding-left:9px;gap:5px}.brand small{display:none}.brand h1{font-size:16px}
    .toolbar{gap:4px}.tool-btn{height:38px;min-width:38px;padding:4px 7px}.tool-label{display:none}.tool-icon{font-size:16px}
    .screen-body{padding:7px;gap:6px}.pool-grid{gap:6px}.pool-card{padding:6px}.pool-header{gap:3px}.pool-stat{font-size:7px}.tone-grid{gap:3px}
    .tone-grid{gap:5px;padding:2px}.tone-pick{width:54px;height:54px;flex-basis:54px;padding:2px}.tone-pick.selected::before{font-size:6px}.die-art{width:min(44px,100%)}
    .screen-footer{padding:7px;gap:7px}.footer-status{font-size:9px}.btn{min-height:46px;padding:8px 10px;font-size:10px}
    .dice-tray-shell{padding:8px}.dice-tray{inset:10px}.tray-die{--die-size:74px}.die-tag{font-size:7px;max-width:108px}
    .drawer{width:100%;border-left:0}.drawer-body{padding:8px}.setup-card{padding:8px}.tone-step{grid-template-columns:46px minmax(0,1fr);padding:4px}.tone-step .die-art{width:43px}
    .committed-grid{grid-template-columns:1fr;grid-template-rows:repeat(6,minmax(0,1fr))}.commit-card{grid-template-columns:46px minmax(0,1fr) auto;padding:4px}.commit-card .die-art{width:43px}.commit-card .flat-die-art{width:41px}
  }
  @media (max-height:560px){
    :root{--header-h:48px;--footer-h:62px}
    .topbar{padding-top:4px;padding-bottom:4px}.tool-btn{height:34px}.screen-body{padding:6px}.play-head{height:26px}.pool-card{padding:4px;gap:3px}.tone-grid{gap:4px;padding:1px}.tone-pick{width:46px;height:46px;flex-basis:46px}.die-art{width:min(40px,100%)}
    .screen-footer{height:var(--footer-h);padding:5px 8px}.btn{min-height:42px}.results-head{height:22px}.dice-tray-shell{padding:6px}.dice-tray{inset:8px}.tray-die{--die-size:62px}.die-tag{top:calc(var(--die-size) + 4px);font-size:6px;padding:2px 4px}
    .drawer{grid-template-rows:48px minmax(0,1fr) 56px}.drawer-head{padding:5px 8px}.drawer-body{padding:6px;gap:5px}.drawer-foot{padding:5px 8px}.setup-card{padding:6px;gap:5px}.pool-tab{height:32px}.name-row input{height:34px}.tone-step{padding:3px}.tone-step .die-art{width:38px}.step-btn,.step-value{height:29px}.committed-grid,.log-list{gap:4px}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><h1>RIFF ROLLER</h1><small>Tabletop Playtest</small></div>
    <div class="toolbar">
      <button class="tool-btn" id="setupBtn" type="button" aria-label="Open dice pool setup"><span class="tool-icon">⚙</span><span class="tool-label">Pools</span></button>
      <button class="tool-btn" id="committedBtn" type="button" aria-label="Open committed dice"><span class="tool-icon">◆</span><span class="tool-label">Committed</span><span class="count-badge" id="topCommitCount">0</span></button>
      <button class="tool-btn" id="logBtn" type="button" aria-label="Open Riff log"><span class="tool-icon">≡</span><span class="tool-label">Log</span></button>

  function parseEmbeddedOBJ(text,name='Built-in fate_v2 rounded die'){
    const verts=[];
    const tris=[];

    for(const raw of text.split(/\r?\n/)){
      const line=raw.trim();

        const p=line.split(/\s+/);

      const len=Math.hypot(d[0],d[1],d[2]);
      if(len<1e-7)return p.slice();
      const r=1-ROUND_CORE;
      return[q[0]+d[0]/len*r,q[1]+d[1]/len*r,q[2]+d[2]/len*r];
    }

      const q=p.map(v=>Math.max(-ROUND_CORE,Math.min(ROUND_CORE,v)));
      const d=[p[0]-q[0],p[1]-q[1],p[2]-q[2]];
      return normalize3(d);
    }

        u[2]*v[0]-u[0]*v[2],

    state.commitSelected.clear();setScreen('result');renderAll();
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));await animateDiceTray();
    state.rolling=false;const summary=state.rolled.map(r=>`${COLORS[r.die.tone].label} ${r.face||'Blank'}`).join(', ');addHistory(`<b>Riff ${state.rollNumber}</b> — ${esc(summary)}`);state.selectedByPool={};save();renderResults();announce(`Riff ${state.rollNumber}. ${state.rolled.map(r=>`${COLORS[r.die.tone].label} ${faceName(r.face)}`).join(', ')}`);
  }

  async function rerollSelected(){
    if(state.rolling||!state.rolled.length||!state.commitSelected.size)return;
    const selectedIds=new Set(state.commitSelected),rerolled=state.rolled.filter(r=>selectedIds.has(r.die.id));
    if(!rerolled.length)return;
    state.rolling=true;hoveredDieId=null;pinnedTooltipDieId=null;renderResults();
    initRerollBodies(selectedIds);els.diceTray.classList.add('rolling');els.diceTrayShell.classList.remove('tray-rumble');void els.diceTrayShell.offsetWidth;els.diceTrayShell.classList.add('tray-rumble');
    const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced){
      for(const b of trayBodies){if(!selectedIds.has(b.r.die.id))continue;b.h=0;const dir=upwardFaceDirection(b),t=stableEulerForTopFace(dir,b.rz);b.rx=t[0];b.ry=t[1];b.vx=b.vy=b.vh=b.wx=b.wy=b.wz=0;}
    }else{
      let last=performance.now(),start=last,quiet=0;
      await new Promise(resolve=>{function frame(now){const {w,h}=canvasMetrics(),dt=Math.min(.025,(now-last)/1000);last=now;stepRerollPhysics(dt,w,h,selectedIds);drawTray();const moving=trayBodies.filter(b=>selectedIds.has(b.r.die.id));const maxMotion=Math.max(...moving.map(b=>Math.hypot(b.vx,b.vy)+Math.abs(b.vh)*.45+(Math.abs(b.wx)+Math.abs(b.wy)+Math.abs(b.wz))*10));const legal=selectedDiceLegal(selectedIds);if(now-start>900&&maxMotion<34&&legal)quiet+=dt;else quiet=0;if(quiet>.30){resolve();return;}if(now-start>6500){for(const b of moving){if(b.h>0)b.h=0;b.vh=0;b.vx*=.72;b.vy*=.72;applyTableGravityTorque(b,dt*4);}}trayAnimFrame=requestAnimationFrame(frame);}trayAnimFrame=requestAnimationFrame(frame);});
    }
    const {w,h}=canvasMetrics();
    for(const b of trayBodies){if(!selectedIds.has(b.r.die.id))continue;b.vx=b.vy=b.vh=b.wx=b.wy=b.wz=0;b.h=0;const dir=upwardFaceDirection(b);b.r.face=state.modelFaceMap[dir]??'';b.r.physicalFace=dir;b.r._rest={x:b.x/w,y:b.y/h,rx:b.rx,ry:b.ry,rz:b.rz};}
    const summary=rerolled.map(r=>`${COLORS[r.die.tone].label} ${r.face||'Blank'}`).join(', ');addHistory(`<b>Rerolled</b> — ${esc(summary)}`);
    state.commitSelected.clear();state.rolling=false;els.diceTray.classList.remove('rolling');els.diceTrayShell.classList.remove('tray-rumble');save();renderResults();drawTray();announce(`Rerolled ${rerolled.length} ${rerolled.length===1?'die':'dice'}.`);
  }

  function commitSelected(){
    if(!state.rolled.length||!state.commitSelected.size)return;const toCommit=state.rolled.filter(r=>state.commitSelected.has(r.die.id)),returned=state.rolled.filter(r=>!state.commitSelected.has(r.die.id));state.committed.push(...toCommit.map(r=>({die:r.die,face:r.face,poolName:r.poolName,rollNumber:state.rollNumber})));addHistory(`<b>Committed</b> — ${esc(toCommit.map(r=>`${COLORS[r.die.tone].label} ${r.face||'Blank'} (${r.poolName})`).join(', '))}`);if(returned.length)addHistory(`<b>Returned</b> — ${returned.length} uncommitted ${returned.length===1?'die':'dice'}`);state.rolled=[];trayBodies=[];hoveredDieId=null;pinnedTooltipDieId=null;state.commitSelected.clear();setScreen('select');save();renderAll();announce(`${toCommit.length} ${toCommit.length===1?'die':'dice'} committed.`);
  }
  function returnCurrentRiff(){if(!state.rolled.length)return;const n=state.rolled.length;addHistory(`<b>Returned</b> — all ${n} dice from Riff ${state.rollNumber}`);state.rolled=[];trayBodies=[];hoveredDieId=null;pinnedTooltipDieId=null;state.commitSelected.clear();setScreen('select');save();renderAll();announce(`${n} dice returned.`);}
  function returnCommitted(id){const i=state.committed.findIndex(c=>c.die.id===id);if(i<0)return;const[c]=state.committed.splice(i,1);addHistory(`<b>Released</b> — ${esc(COLORS[c.die.tone].label)} ${esc(c.face||'Blank')} to ${esc(c.poolName)}`);save();renderAll();announce(`Die returned to ${c.poolName}.`);}
  function returnAllCommitted(){const n=state.committed.length;if(!n)return;state.committed=[];addHistory(`<b>Released</b> — all ${n} committed dice returned`);save();state.drawerPage=0;renderAll();announce(`${n} committed dice returned.`);}

  function openDrawer(type){state.drawer=type;state.drawerPage=0;if(type==='setup'){state.setupDraft=clone(state.config);state.setupPool=Math.min(state.setupPool,state.setupDraft.length-1);}els.drawerOverlay.classList.add('open');els.drawerOverlay.setAttribute('aria-hidden','false');renderDrawer();document.getElementById('closeDrawer').focus();}
  function closeDrawer(){state.drawer=null;state.setupDraft=null;els.drawerOverlay.classList.remove('open');els.drawerOverlay.setAttribute('aria-hidden','true');}
  function renderDrawer(){if(state.drawer==='setup')renderSetupDrawer();else if(state.drawer==='committed')renderCommittedDrawer();else if(state.drawer==='log')renderLogDrawer();}

  function renderModelDrawer(){
    els.drawerTitle.textContent='Die Model';els.drawerSub.textContent=dieMesh?'STL active':'Fallback cube';
    const diag=dieMesh?.diagnostics?.info||{};const dirs=Object.keys(FACE_DIRS);const resultOption=(v,label,cur)=>`<option value="${v}" ${cur===v?'selected':''}>${label}</option>`;
    els.drawerBody.innerHTML=`<section class="model-card"><div class="model-status">${dieMesh?`<b>${esc(dieMesh.name)}</b><br>${dieMesh.triCount.toLocaleString()} triangles · recessed geometry rendered with high-contrast stepped lighting and depth-darkened engravings.`:`<b>No STL mesh is embedded in this copy.</b><br>Choose your fate_v2.stl file once. The browser stores it locally for later sessions. This renderer uses high-contrast face lighting and darkens recessed geometry so the symbols remain readable.`}</div><div class="model-actions"><label class="file-btn">${dieMesh?'Replace STL':'Load STL'}<input id="modelFile" type="file" accept=".stl,model/stl,application/sla"></label><button class="tiny-btn" type="button" id="autoMapBtn" ${dieMesh?'':'disabled'}>Auto Detect Faces</button><button class="tiny-btn" type="button" id="clearModelBtn" ${dieMesh?'':'disabled'}>Use Fallback</button><button class="tiny-btn" type="button" id="exportModelBtn" ${dieMesh?'':'disabled'}>Export Embedded HTML</button></div><div class="mapping-grid">${dirs.map(k=>`<label class="mapping-cell"><b>${FACE_LABELS[k]} face${diag[k]?` · ${diag[k].count} recess pts`:''}</b><select data-face-map="${k}">${resultOption('+','High +',state.modelFaceMap[k])}${resultOption('−','Low −',state.modelFaceMap[k])}${resultOption('','Neutral',state.modelFaceMap[k])}</select></label>`).join('')}</div></section>`;
    els.drawerFoot.innerHTML=`<div class="setup-inventory">Each result must map to two physical faces.</div><button class="btn gold" id="closeModelBtn" type="button">Done</button>`;
  }

  async function importModelFile(file){
    try{const buffer=await file.arrayBuffer(),mesh=parseSTLBuffer(buffer,file.name||'Custom STL die');dieMesh=mesh;currentModelBase64=bufferToBase64(buffer);state.modelFaceMap={...mesh.diagnostics.map};state.modelFaceMapCustom=false;uploadMesh();await storeModelBuffer(buffer);trayBodies=[];save();renderTop();renderResults();renderModelDrawer();announce(`STL loaded. ${mesh.triCount} triangles.`);}catch(err){announce('Could not read that STL file.');els.drawerSub.textContent='STL error';console.error(err);}
  }
  function exportEmbeddedHtml(){if(!currentModelBase64)return;let html='<!doctype html>\n'+document.documentElement.outerHTML;html=html.replace(/const EMBEDDED_STL_BASE64='[^']*';/,`const EMBEDDED_STL_BASE64='${currentModelBase64}';`);const blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='guitar-hero-riff-roller-stl.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);announce('Embedded standalone HTML exported.');}
  function validFaceMap(map){const vals=Object.values(map||{});return vals.filter(v=>v==='+').length===2&&vals.filter(v=>v==='−').length===2&&vals.filter(v=>v==='').length===2;}

  function inventoryText(){const source=state.setupDraft||state.config;const totals=Object.fromEntries(TONES.map(t=>[t,source.reduce((s,p)=>s+clampInt(p[t],0,12),0)]));return TONES.map(t=>`${COLORS[t].label} ${totals[t]}`).join(' · ');}
  function renderSetupDrawer(){
    const draft=state.setupDraft||clone(state.config);state.setupDraft=draft;const i=Math.min(state.setupPool,draft.length-1),cfg=draft[i];state.setupPool=i;els.drawerTitle.textContent='Dice Pool Setup';els.drawerSub.textContent=`${draft.length} ${draft.length===1?'pool':'pools'}`;
    els.drawerBody.innerHTML=`<div class="setup-pool-tabs">${draft.map((p,n)=>`<button class="pool-tab ${n===i?'active':''}" type="button" data-setup-pool="${n}">${esc(p.name||`Pool ${n+1}`)}</button>`).join('')}</div><section class="setup-card"><div class="name-row"><label>Pool name<input type="text" id="setupName" maxlength="24" value="${esc(cfg.name)}"></label><button class="tiny-btn" type="button" id="removePoolBtn" ${draft.length<=1?'disabled':''}>Remove Pool</button></div><div class="tone-steppers">${TONES.map(t=>`<div class="tone-step">${dieSvg(t,'',COLORS[t].label+' Tone')}<div><div class="step-label">${COLORS[t].label} dice</div><div class="stepper"><button class="step-btn" type="button" data-step-tone="${t}" data-delta="-1" ${cfg[t]<=0?'disabled':''}>−</button><div class="step-value">${clampInt(cfg[t],0,12)}</div><button class="step-btn" type="button" data-step-tone="${t}" data-delta="1" ${cfg[t]>=12?'disabled':''}>+</button></div></div></div>`).join('')}</div></section>`;
    els.drawerFoot.innerHTML=`<div><div class="setup-inventory">${inventoryText()}</div><button class="tiny-btn" id="defaultSetupBtn" type="button">Default 4 Pools</button></div><div class="footer-actions"><button class="btn" id="addPoolBtn" type="button" ${draft.length>=8?'disabled':''}>+ Pool</button><button class="btn gold" id="applySetupBtn" type="button">Apply Setup</button></div>`;
  }
  function syncSetupName(){const input=document.getElementById('setupName');if(input&&state.setupDraft?.[state.setupPool])state.setupDraft[state.setupPool].name=input.value.trim()||`Pool ${state.setupPool+1}`;}
  function stepTone(tone,delta){syncSetupName();const cfg=state.setupDraft[state.setupPool];cfg[tone]=clampInt(cfg[tone]+delta,0,12);renderSetupDrawer();}
  function applySetup(){syncSetupName();const draft=state.setupDraft||clone(state.config);if(draft.every(p=>TONES.every(t=>p[t]===0))){announce('Add at least one die to the setup.');return;}state.config=clone(draft);state.pools=createPools(state.config);state.selectedByPool={};state.rolled=[];trayBodies=[];state.commitSelected.clear();state.committed=[];state.history=[];state.rollNumber=0;state.poolPage=0;setScreen('select');closeDrawer();save();renderAll();announce('Dice pool setup applied.');}

  function renderCommittedDrawer(){
    const pageSize=6,pageCount=Math.max(1,Math.ceil(state.committed.length/pageSize));state.drawerPage=Math.min(state.drawerPage,pageCount-1);const start=state.drawerPage*pageSize,items=state.committed.slice(start,start+pageSize);els.drawerTitle.textContent='Committed Dice';els.drawerSub.textContent=`${state.committed.length} committed`;
    els.drawerBody.innerHTML=items.length?`<div class="committed-grid">${items.map(c=>`<div class="commit-card">${flatDieSvg(c.die.tone,c.face)}<div class="commit-copy"><b>${esc(c.poolName)}</b><span>${COLORS[c.die.tone].label} · ${faceName(c.face)}</span></div><button class="tiny-btn" type="button" data-return-committed="${c.die.id}">Return</button></div>`).join('')}</div>`:`<div class="empty-state">Committed dice stay out of their pools until you return them.</div>`;
    els.drawerFoot.innerHTML=`<button class="btn" id="returnAllBtn" type="button" ${state.committed.length?'':'disabled'}>Return All</button><div class="drawer-pager"><button class="pager-btn" type="button" data-drawer-page="${state.drawerPage-1}" ${state.drawerPage===0?'disabled':''}>‹</button><span class="pager-label">${pageCount>1?`Page ${state.drawerPage+1}/${pageCount}`:'Page 1'}</span><button class="pager-btn" type="button" data-drawer-page="${state.drawerPage+1}" ${state.drawerPage>=pageCount-1?'disabled':''}>›</button></div>`;
  }

  function renderLogDrawer(){
    const pageSize=6,pageCount=Math.max(1,Math.ceil(state.history.length/pageSize));state.drawerPage=Math.min(state.drawerPage,pageCount-1);const start=state.drawerPage*pageSize,items=state.history.slice(start,start+pageSize);els.drawerTitle.textContent='Riff Log';els.drawerSub.textContent=state.history.length?`${state.history.length} entries`:'No entries';
    els.drawerBody.innerHTML=items.length?`<div class="log-list">${items.map(h=>`<div class="log-row"><span>${h}</span></div>`).join('')}</div>`:`<div class="empty-state">Roll a Riff and the session log will appear here.</div>`;
    els.drawerFoot.innerHTML=`<button class="tiny-btn" id="clearLogBtn" type="button" ${state.history.length?'':'disabled'}>Clear Log</button><div class="drawer-pager"><button class="pager-btn" type="button" data-drawer-page="${state.drawerPage-1}" ${state.drawerPage===0?'disabled':''}>‹</button><span class="pager-label">${pageCount>1?`Page ${state.drawerPage+1}/${pageCount}`:'Page 1'}</span><button class="pager-btn" type="button" data-drawer-page="${state.drawerPage+1}" ${state.drawerPage>=pageCount-1?'disabled':''}>›</button></div>`;
  }

  function armReset(){
    if(state.resetArmed){const keep=clone(state.config);initFresh(keep);state.resetArmed=false;clearTimeout(resetTimer);renderAll();announce('Session reset. Pool setup kept.');return;}
    state.resetArmed=true;renderTop();announce('Press Reset again to confirm.');clearTimeout(resetTimer);resetTimer=setTimeout(()=>{state.resetArmed=false;renderTop();},2500);
  }

  ROOT.addEventListener('click',e=>{
    const diePick=e.target.closest('[data-pick-die]');if(diePick&&!state.rolled.length&&!state.rolling){const poolId=diePick.dataset.poolId,dieId=diePick.dataset.pickDie;if(findDie(poolId,dieId)){toggleDieSelection(poolId,dieId);save();renderPools();}return;}
    const poolPage=e.target.closest('[data-pool-page]');if(poolPage){state.poolPage=clampInt(poolPage.dataset.poolPage,0,10);save();renderPools();return;}
    const setupPool=e.target.closest('[data-setup-pool]');if(setupPool){syncSetupName();state.setupPool=clampInt(setupPool.dataset.setupPool,0,state.config.length-1);renderSetupDrawer();return;}
    const step=e.target.closest('[data-step-tone]');if(step){stepTone(step.dataset.stepTone,Number(step.dataset.delta));return;}
    const ret=e.target.closest('[data-return-committed]');if(ret){returnCommitted(ret.dataset.returnCommitted);return;}
    const dpage=e.target.closest('[data-drawer-page]');if(dpage){state.drawerPage=clampInt(dpage.dataset.drawerPage,0,999);renderDrawer();return;}
    if(e.target.closest('#removePoolBtn')){syncSetupName();if(state.setupDraft.length>1){state.setupDraft.splice(state.setupPool,1);state.setupPool=Math.max(0,state.setupPool-1);renderSetupDrawer();}return;}
    if(e.target.closest('#addPoolBtn')){syncSetupName();if(state.setupDraft.length<8){state.setupDraft.push({name:`Pool ${state.setupDraft.length+1}`,red:1,green:1,blue:1,purple:1});state.setupPool=state.setupDraft.length-1;renderSetupDrawer();}return;}
    if(e.target.closest('#defaultSetupBtn')){state.setupDraft=clone(DEFAULT_CONFIG);state.setupPool=0;renderSetupDrawer();return;}
    if(e.target.closest('#applySetupBtn')){applySetup();return;}
    if(e.target.closest('#returnAllBtn')){returnAllCommitted();return;}
    if(e.target.closest('#clearLogBtn')){state.history=[];state.drawerPage=0;save();renderLogDrawer();announce('Riff log cleared.');return;}
    if(e.target.closest('#autoMapBtn')){if(dieMesh?.diagnostics?.map){state.modelFaceMap={...dieMesh.diagnostics.map};state.modelFaceMapCustom=false;save();renderModelDrawer();announce('Recessed faces auto-detected.');}return;}
    if(e.target.closest('#clearModelBtn')){clearStoredModel().then(()=>{renderModelDrawer();announce('Using the fallback die model.');});return;}
    if(e.target.closest('#exportModelBtn')){exportEmbeddedHtml();return;}
    if(e.target.closest('#closeModelBtn')){closeDrawer();return;}
  });

  document.getElementById('setupBtn').addEventListener('click',()=>openDrawer('setup'));
    document.getElementById('committedBtn').addEventListener('click',()=>openDrawer('committed'));
  document.getElementById('logBtn').addEventListener('click',()=>openDrawer('log'));
  document.getElementById('resetBtn').addEventListener('click',armReset);
  document.getElementById('closeDrawer').addEventListener('click',closeDrawer);
  els.drawerOverlay.addEventListener('click',e=>{if(e.target===els.drawerOverlay)closeDrawer();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.drawer)closeDrawer();});
  els.rollBtn.addEventListener('click',rollSelected);
  els.rerollBtn.addEventListener('click',rerollSelected);
  els.commitBtn.addEventListener('click',commitSelected);
  els.returnRiffBtn.addEventListener('click',returnCurrentRiff);
  function handleDiePointer(e){
    if(state.rolling||!state.rolled.length)return;
    const hit=hitTestDie(e.clientX,e.clientY);
    if(!hit){pinnedTooltipDieId=null;hoveredDieId=null;drawTray();return;}
    pinnedTooltipDieId=hit.r.die.id;
    const id=hit.r.die.id;
    if(state.commitSelected.has(id))state.commitSelected.delete(id);else state.commitSelected.add(id);
    save();renderResults();
    const marked=state.commitSelected.has(id);
    els.resultStatus.innerHTML=marked?`<b>${COLORS[hit.r.die.tone].label} ${faceName(hit.r.face)}</b> from ${esc(hit.r.poolName)} selected. Choose Reroll or Commit.`:`${COLORS[hit.r.die.tone].label} ${faceName(hit.r.face)} unselected.`;
  }
  function handleDieHover(e){
    if(state.rolling||!state.rolled.length){if(hoveredDieId!==null){hoveredDieId=null;drawTray();}return;}
    const hit=hitTestDie(e.clientX,e.clientY),next=hit?.r.die.id||null;
    if(next===hoveredDieId)return;hoveredDieId=next;drawTray();
  }
  function clearDieHover(){if(hoveredDieId===null)return;hoveredDieId=null;drawTray();}
  for(const canvas of [els.diceCanvas,els.meshCanvas]){
    canvas.addEventListener('pointerdown',handleDiePointer);
    canvas.addEventListener('pointermove',handleDieHover);
    canvas.addEventListener('pointerleave',clearDieHover);
  }

  window.addEventListener('resize',()=>{if(state.screen==='result'&&!state.rolling){trayBodies=[];makeRestBodies();drawTray();}});

  if(!load())initFresh();
  try{
    dieMesh=parseEmbeddedOBJ(EMBEDDED_OBJ_TEXT,'Built-in fate_v2 rounded OBJ');
    state.modelFaceMap={px:'+',nx:'+',py:'−',ny:'−',pz:'',nz:''};
    state.modelFaceMapCustom=true;
    uploadMesh();
  }catch(err){
    console.error('Embedded OBJ failed to initialize',err);
    dieMesh=null;
  }
  renderAll();
  setScreen(state.rolled.length?'result':'select');
  renderTop();
  renderResults();
})();
</script>
</body>
